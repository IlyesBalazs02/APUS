<header>
    <!-- List all activities -->
    <button class="btn btn-primary submit-button" routerLink="/activities" routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }" *ngIf="(loggedIn$ | async)">
        All Activities
    </button>

    <!-- Upload a GPX file -->
    <button class="btn btn-primary submit-button" routerLink="/activities/upload" routerLinkActive="active"
        *ngIf="(loggedIn$ | async)">
        Upload Activity
    </button>

    <!-- Create Route -->
    <button class="btn btn-primary submit-button" routerLink="/createRoute" routerLinkActive="active"
        *ngIf="(loggedIn$ | async)">
        Create Route
    </button>

    <button class="btn btn-primary submit-button" routerLink="/userprofile" routerLinkActive="active"
        *ngIf="(loggedIn$ | async)">
        Profile
    </button>

    <button class="btn btn-primary submit-button" routerLink="/settings" routerLinkActive="active"
        *ngIf="(loggedIn$ | async)">
        Settings
    </button>

    <button class="btn btn-primary submit-button" routerLink="/groups" routerLinkActive="active"
        *ngIf="(loggedIn$ | async)">
        Groups
    </button>

    <div class="search-bar" *ngIf="(loggedIn$ | async)">
        <app-search-bar></app-search-bar>
    </div>

    <!--
    <button mat-button [routerLink]="['/friends/requests']" [matBadge]="count$ | async" matBadgeColor="primary"
        [matBadgeHidden]="!(count$ | async)" *ngIf="(loggedIn$ | async)">
        Friend Requests
    </button>
    -->

    <!-- Authentication -->
    <button class="btn btn-primary submit-button" routerLink="/register" *ngIf="!(loggedIn$ | async)">
        Register
    </button>

    <button class="btn btn-primary submit-button" routerLink="/login" *ngIf="!(loggedIn$ | async)">
        Login
    </button>

    <button class="btn btn-primary submit-button" *ngIf="(loggedIn$ | async)" (click)="logout()">
        Log Outs
    </button>
</header>
