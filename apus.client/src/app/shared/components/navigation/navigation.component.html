<header class="top-nav">
    <div class="nav-inner">
        <a class="nav-brand" routerLink="/activities">
            APUS
        </a>

        <div class="nav-center" *ngIf="(loggedIn$ | async)">
            <nav class="nav-links">
                <a routerLink="/activities" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                    All activities
                </a>

                <a routerLink="/createRoute" routerLinkActive="active">
                    Create route
                </a>

                <a routerLink="/groups" routerLinkActive="active">
                    Groups
                </a>
            </nav>

            <div class="nav-search">
                <app-search-bar></app-search-bar>
            </div>
        </div>

        <div class="nav-right">
            <ng-container *ngIf="!(loggedIn$ | async)">
                <a routerLink="/login" class="nav-auth-link">
                    Login
                </a>
                <a routerLink="/register" class="nav-auth-button">
                    Sign up
                </a>
            </ng-container>

            <ng-container *ngIf="(loggedIn$ | async)">
                <a routerLink="/userprofile" routerLinkActive="active" class="nav-secondary-link">
                    Profile
                </a>

                <a routerLink="/settings" routerLinkActive="active" class="nav-secondary-link">
                    Settings
                </a>

                <button class="nav-logout" (click)="logout()">
                    Log out
                </button>
            </ng-container>
        </div>
    </div>
</header>
