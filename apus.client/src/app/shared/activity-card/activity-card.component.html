<div class="card">
    <!-- Header -->
    <div class="card-header">
        <!-- Title + description left -->
        <div class="left-section">
            <h5 class="card-title clickable-heading" [routerLink]="['/activities', activity.id]">
                {{ activity.title }}
            </h5>
            <small class="text-muted">{{ activity.activityType }}</small>

            <p *ngIf="activity.description" class="activity-description">
                {{ activity.description }}
            </p>
        </div>

        <!-- User info top-right -->
        <div class="user-info">
            <img [src]="activity.avatarUrl || '/Perm/DefaultProfile.png'" alt="User avatar" />
            <div class="username">{{ activity.userFullName }}</div>
        </div>
    </div>

    <!-- Middle metrics -->
    <div class="card-body text-center">
        <div class="row justify-content-center">
            <ng-container *ngFor="let p of displayProps">
                <div class="col-auto mb-3">
                    <div class="h5 mb-1">{{ p.value }}</div>
                    <div class="small text-muted">{{ p.label }}</div>
                </div>
            </ng-container>

            <div class="col-auto mb-3">
                <div class="h5 mb-1">{{ activity.duration }}</div>
                <div class="small text-muted">Time</div>
            </div>
        </div>
    </div>

    <!-- Track map -->
    <div class="image-map-container" *ngIf="trackImage">
        <img [src]="trackImage" alt="Activity track map" class="track-image" />
    </div>

    <!-- Gallery -->
    <div class="images-container" *ngIf="images.length">
        <div class="thumb" *ngFor="let url of images | slice:0:3; let i = index" (click)="openViewer(i)">
            <img [src]="url" alt="image" />
            <div class="overlay" *ngIf="i === 2 && images.length > 3">+{{ images.length - 3 }}</div>
        </div>
    </div>

    <!-- Like bar -->
    <div class="like-icon">
        <i class="bi bi-hand-thumbs-up"></i>
        <span>{{ activity.likescount }}</span>
    </div>
</div>

<app-comments-modal [isOpen]="commentsOpen" [loadUrl]="'/api/activities/' + activity.id + '/comments'"
    [postUrl]="'/api/activities/' + activity.id + '/comments'" (closed)="closeCommentsModal()" title="Comments">
</app-comments-modal>


<!-- Lightbox (unchanged) -->
<div class="lightbox-overlay" *ngIf="selectedIndex !== null" (click)="closeViewer()">
    <button type="button" class="lightbox-btn prev" (click)="prevImage($event)">‹</button>
    <img class="lightbox-img" [src]="images[selectedIndex!]" alt="full-size image" (click)="$event.stopPropagation()" />
    <button type="button" class="lightbox-btn next" (click)="nextImage($event)">›</button>
</div>
