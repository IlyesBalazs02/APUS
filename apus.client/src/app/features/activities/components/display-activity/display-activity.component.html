<div class="activity-page">
    <div class="card activity-card">
        <!-- HEADER -->
        <div class="card-header activity-header">
            <div class="title-block">
                <h2 class="card-title mb-0">
                    {{ activity.title || 'Activity' }}
                </h2>
                <small class="activity-subtitle">
                    {{ activity.displayName ?? 'Activity' }}
                </small>
            </div>

            <button class="btn btn-primary btn-edit" (click)="editActivity()">
                Edit activity
            </button>
        </div>

        <!-- BODY -->
        <div class="card-body activity-body">
            <!-- DESCRIPTION -->
            <div *ngIf="activity.description" class="activity-description">
                <label class="section-label">Description</label>
                <p class="description-text">
                    {{ activity.description }}
                </p>
            </div>

            <!-- SUMMARY GRID -->
            <div class="summary-section" *ngIf="fieldsToShow && fieldsToShow.length">
                <div class="summary-grid">
                    <div class="summary-item" *ngFor="let field of fieldsToShow">
                        <div class="summary-value">
                            {{ activity[field] }}
                        </div>
                        <div class="summary-label">
                            {{ labels[field] || field }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- MAIN LAYOUT: MAP + CHARTS + PHOTOS -->
            <div class="activity-main-layout">
                <!-- LEFT COLUMN: MAP -->
                <div class="main-column">
                    <section class="map-section" *ngIf="(trackpoints && trackpoints.length) || imageMapData.length">
                        <div class="section-header">
                            <h6 class="section-title">Route</h6>
                            <span class="section-hint" *ngIf="trackpoints?.length">
                                {{ trackpoints.length }} track points
                            </span>
                        </div>

                        <div class="map-card">
                            <app-activity-map [trackpoints]="trackpoints" [imagePoints]="imageMapData">
                            </app-activity-map>
                        </div>
                    </section>
                </div>

                <!-- RIGHT COLUMN: PHOTOS -->
                <aside class="side-column" *ngIf="images.length">
                    <div class="section-header photos-header">
                        <h6 class="section-title">
                            Photos ({{ images.length }})
                        </h6>
                        <span class="section-hint">
                            Click to view full screen
                        </span>
                    </div>

                    <div class="images-container">
                        <div class="thumb" *ngFor="let img of images; let i = index" (click)="openViewer(i)">
                            <img [src]="img.url" alt="activity image" loading="lazy" />
                        </div>
                    </div>
                </aside>
            </div>

            <!-- CHARTS (FULL WIDTH) -->
            <section class="charts-section" *ngIf="trackpoints && trackpoints.length">
                <div class="section-header">
                    <h6 class="section-title">Charts</h6>
                    <span class="section-hint">
                        Elevation &amp; heart rate profiles
                    </span>
                </div>

                <div class="charts-card">
                    <app-activity-chart-component [trackpoints]="trackpoints"></app-activity-chart-component>
                </div>
            </section>
        </div>
    </div>

    <!-- LIGHTBOX OVERLAY -->
    <div class="lightbox-overlay" *ngIf="selectedIndex !== null" (click)="closeViewer()">
        <button type="button" class="lightbox-btn prev" (click)="prevImage($event)">
            ‹
        </button>

        <img class="lightbox-img" [src]="images[selectedIndex!].url" alt="full-size image"
            (click)="$event.stopPropagation()" />

        <button type="button" class="lightbox-btn next" (click)="nextImage($event)">
            ›
        </button>
    </div>
</div>
