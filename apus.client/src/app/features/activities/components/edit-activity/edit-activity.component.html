<form #editForm="ngForm" (ngSubmit)="submit(editForm)" class="container mt-3">

    <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input id="title" name="title" class="form-control" type="text" [(ngModel)]="editModel.title" required />
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" name="description" class="form-control" rows="3"
            [(ngModel)]="editModel.description"></textarea>
    </div>

    <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input id="date" name="date" class="form-control" type="date" [(ngModel)]="editModel.date" required />
    </div>

    <div class="mb-3">
        <label for="activityType" class="form-label">Activity type</label>
        <select id="activityType" name="activityType" class="form-select" [(ngModel)]="editModel.activityType" required>
            <option *ngFor="let t of activityTypes" [value]="t.value">
                {{ t.label }}
            </option>
        </select>
    </div>

    <div class="mb-3">
        <h5>Images</h5>

        <!-- Existing images -->
        <div class="preview-container mb-2" *ngIf="images.length">
            <div class="thumb" *ngFor="let img of images; let i = index">
                <button type="button" class="remove-btn" (click)="markImageForDeletion(i)">×</button>
                <img [src]="img" alt="Activity image" />
            </div>
        </div>

        <p *ngIf="!images.length && !newPreviewUrls.length" class="text-muted">
            No images attached.
        </p>

        <!-- Dropzone for new images -->
        <div class="dropzone" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)"
            [class.dragover]="isDragOver">
            <p>Drag & drop new images here, or click to browse</p>
            <input #fileInput type="file" multiple accept="image/*" (change)="onImageFileSelected($event)" hidden />
            <button type="button" (click)="fileInput.click()">Browse Images</button>
        </div>

        <!-- New images preview -->
        <div class="preview-container mt-2" *ngIf="newPreviewUrls.length">
            <div class="thumb" *ngFor="let url of newPreviewUrls; let i = index">
                <button type="button" class="remove-btn" (click)="removeNewImage(i)">×</button>
                <img [src]="url" alt="New image preview" />
            </div>
        </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid">
        Save
    </button>
</form>
