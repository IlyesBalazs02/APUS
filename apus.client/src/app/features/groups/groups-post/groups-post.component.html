<div class="group-posts">

    <!-- CREATE POST CARD (same style as group create card) -->
    <div class="card create-post-card" *ngIf="canPost">
        <h3>Create Post</h3>

        <div class="field">
            <label>Title</label>
            <input type="text" [(ngModel)]="title" maxlength="200" placeholder="Post title..." />
        </div>

        <div class="field">
            <label>Text</label>
            <textarea rows="4" [(ngModel)]="text" maxlength="4000" placeholder="Write something..."></textarea>
        </div>

        <div class="actions">
            <button class="btn primary" (click)="createPost()" [disabled]="creating || !title.trim() || !text.trim()">
                {{ creating ? 'Posting…' : 'Post' }}
            </button>
        </div>

        <p class="error" *ngIf="createError">{{ createError }}</p>
    </div>


    <!-- POSTS LIST -->
    <div *ngIf="loading && posts.length === 0" class="loading">
        Loading posts…
    </div>

    <div *ngIf="!loading && posts.length === 0" class="empty">
        No posts yet.
    </div>


    <!-- POST CARD -->
    <article class="card post-card" *ngFor="let p of posts">
        <header class="post-header">
            <div class="author">
                <img [src]="avatarUrl(p)" class="avatar small-avatar" />
                <div class="meta">
                    <strong>{{ p.authorFullName }}</strong>
                    <small>{{ p.createdAtUtc | date:'medium' }}</small>
                </div>
            </div>

            <button *ngIf="canDelete(p)" class="btn danger small" (click)="deletePost(p)">
                Delete
            </button>
        </header>

        <h3 class="post-title">{{ p.title }}</h3>
        <p class="post-text">{{ p.text }}</p>
    </article>


    <!-- LOAD MORE -->
    <div class="load-more" *ngIf="hasMore && posts.length > 0">
        <button class="btn" (click)="loadMore()" [disabled]="loadingMore">
            {{ loadingMore ? 'Loading…' : 'Load more' }}
        </button>
    </div>

</div>
