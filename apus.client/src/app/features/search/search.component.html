<div class="search-container">
    <!-- HEADER -->
    <header class="search-header">
        <div class="header-main">
            <h1>Search</h1>
            <p class="subtitle">
                Find users, friends and groups across the platform.
            </p>
        </div>
    </header>

    <!-- SEARCH BAR -->
    <form class="searchbar" (ngSubmit)="onSubmit()">
        <div class="searchbar-inner">
            <span class="prefix-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path
                        d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 0 0 1.57-4.23C15.99 6.01 13.48 3.5 10.49 3.5S5 6.01 5 9s2.51 5.5 5.5 5.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0s.41-1.08 0-1.49L15.5 14zm-5 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z" />
                </svg>
            </span>

            <input type="text" [formControl]="q" placeholder="Search users, friends, groups…" (keyup.enter)="onSubmit()"
                autocomplete="off" />

            <button type="submit" class="btn primary">
                Search
            </button>
        </div>
    </form>

    <!-- TABS -->
    <nav class="search-nav">
        <a routerLink="users" routerLinkActive="active" [queryParamsHandling]="'merge'">
            Users
        </a>

        <a routerLink="friends" routerLinkActive="active" [queryParamsHandling]="'merge'">
            Friends
        </a>

        <a routerLink="requests" routerLinkActive="active" [queryParamsHandling]="'merge'">
            Friend Requests
        </a>
    </nav>

    <!-- CONTENT -->
    <section class="search-content">
        <div class="search-card">
            <router-outlet></router-outlet>
        </div>
    </section>
</div>
