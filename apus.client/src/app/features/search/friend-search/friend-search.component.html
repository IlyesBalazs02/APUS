<div *ngIf="friends.length > 0" class="mt-4">
    <div class="cards">
        <div *ngFor="let f of friends; trackBy: trackById" class="user-card">
            <div class="flex items-center gap-3 min-w-0">
                <img [src]="f.avatarUrl || '/Perm/DefaultProfile.png'" class="user-avatar" alt="avatar" />
                <div class="min-w-0">
                    <a [routerLink]="['/profile', f.id]" class="text-sky-500 hover:underline font-medium truncate">
                        {{ f.fullName }}
                    </a>
                    <div *ngIf="f.fullName" class="text-xs text-gray-400 truncate">
                        {{ '@' + f.fullName }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
