<mat-form-field appearance="outline" class="w-full max-w-md">
    <mat-label>Search</mat-label>

    <span matPrefix class="prefix-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
            <path
                d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 0 0 1.57-4.23C15.99 6.01 13.48 3.5 10.49 3.5S5 6.01 5 9s2.51 5.5 5.5 5.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0s.41-1.08 0-1.49L15.5 14zm-5 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z" />
        </svg>
    </span>

    <mat-select [formControl]="selectedCtrl" (openedChange)=" $event ? onOpened() : onClosed() " (closed)="onClosed()"
        (selectionChange)="onSelect($event.value)" panelClass="friend-search-panel" #selectRef>

        <mat-option>
            <ngx-mat-select-search [formControl]="filterCtrl" placeholderLabel="Type to search…"
                noEntriesFoundLabel="No matches" (keydown.enter)="onEnter($event)">
            </ngx-mat-select-search>

        </mat-option>

        <mat-option *ngFor="let u of results" [value]="u">
            <div class="flex items-center gap-3">
                <img *ngIf="u.avatarUrl" [src]="u.avatarUrl" alt="" class="w-6 h-6 rounded-full" />
                <span>{{ u.fullName }}</span>
            </div>
        </mat-option>
    </mat-select>
</mat-form-field>
