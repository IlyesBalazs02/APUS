<div class="create-route-page">
    <div class="map-container">
        <div id="map"></div>

        <div class="coordinate-selector">
            <div><strong>Create route</strong></div>
            <div>1. Click on the map to snap to a road.</div>
            <div>2. After 2+ points, a route is drawn between the last two.</div>
        </div>
    </div>

    <!-- Route summary + elevation chart (Gaia-like bottom bar) -->
    <div class="route-summary" *ngIf="fullRouteCoords.length > 1">
        <div class="route-toolbar">
            <div class="stats-left">
                <span class="stat-main">
                    {{ totalDistanceMeters / 1000 | number : '1.1-1' }} km
                </span>
                <span class="stat-sub">
                    ↑ {{ totalAscentMeters | number : '1.0-0' }} m
                </span>
                <span class="stat-sub">
                    ↓ {{ totalDescentMeters | number : '1.0-0' }} m
                </span>
            </div>

            <div class="actions-right">
                <button type="button" class="toolbar-btn" (click)="undoLastSection()"
                    [disabled]="routeSegments.length === 0 && snappedPoints.length <= 1">
                    Undo last
                </button>


                <button type="button" class="toolbar-btn" (click)="addOutAndBack()"
                    [disabled]="fullRouteCoords.length < 2">
                    Out &amp; back
                </button>

                <button type="button" class="toolbar-btn" (click)="downloadGpx()"
                    [disabled]="totalDistanceMeters === 0">
                    GPX
                </button>

                <button type="button" class="toolbar-btn toolbar-btn-primary" (click)="saveRoute()"
                    [disabled]="fullRouteCoords.length < 2">
                    Save
                </button>
            </div>
        </div>

        <div class="elevation-chart" *ngIf="hasElevationProfile">
            <canvas baseChart [data]="elevationChartData" [options]="elevationChartOptions" [type]="'line'"
                [style.height.px]="160">
            </canvas>
        </div>
    </div>
</div>
