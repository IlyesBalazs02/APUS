<div class="create-route-page">
    <div class="map-container">
        <div id="map"></div>

        <div class="coordinate-selector">
            <div><strong>Create route</strong></div>
            <div>1. Click on the map to snap to a road.</div>
            <div>2. After 2+ points, a route is drawn between the last two.</div>
        </div>
    </div>

    <!-- Route summary + elevation chart -->
    <div class="route-summary" *ngIf="fullRouteCoords.length > 1">
        <div class="stats-row">
            <span>
                Distance: {{ totalDistanceMeters / 1000 | number : '1.2-2' }} km
            </span>

            <button type="button" (click)="downloadGpx()" [disabled]="totalDistanceMeters === 0">
                Download GPX
            </button>
        </div>

        <div *ngIf="hasElevationProfile">
            <h6>Elevation Profile</h6>
            <div style="display: block; width: 100%;">
                <canvas baseChart [data]="elevationChartData" [options]="elevationChartOptions" [type]="'line'"
                    [style.height.px]="300">
                </canvas>
            </div>
        </div>
    </div>
</div>
