<div class="settings-container">
    <h2>Profile Settings</h2>

    <form [formGroup]="profileForm" (ngSubmit)="onSave()">
        <div class="setting-item">
            <div class="name-fields">
                <div class="setting-info">
                    <label>First Name</label>
                    <input type="text" formControlName="firstName" placeholder="Enter your first name" />
                </div>

                <div class="setting-info">
                    <label>Last Name</label>
                    <input type="text" formControlName="lastName" placeholder="Enter your last name" />
                </div>
            </div>
        </div>


        <div class="setting-item">
            <div class="setting-info">
                <label>Avatar</label>
                <p>Choose a profile picture visible to others.</p>
            </div>
            <div class="avatar-upload">
                <img [src]="avatarPreview" alt="Avatar preview" class="avatar-preview" />
                <input type="file" (change)="onAvatarChange($event)" accept="image/*" />
            </div>
        </div>

        <div class="setting-item">
            <div class="setting-info">
                <label>Bio</label>
                <p>Tell something about yourself (max 300 characters).</p>
            </div>
            <textarea formControlName="bio" rows="4" placeholder="Write your bio..." maxlength="300"></textarea>
            <div class="char-counter">
                {{ profileForm.get('bio')?.value?.length || 0 }}/300
            </div>
        </div>

        <button type="submit" class="save-btn" [disabled]="profileForm.invalid || isSaving">
            {{ isSaving ? 'Saving…' : 'Save Changes' }}
        </button>
    </form>
</div>
