<div class="register-page">
    <div class="register-card">
        <header class="register-header">
            <h1>Create account</h1>
            <p class="subtitle">
                Set up your account to start tracking and sharing your activities.
            </p>
        </header>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="register-form">
            <!-- First name -->
            <div class="form-row two-cols">
                <div class="form-group">
                    <label for="firstname">First name</label>
                    <input id="firstname" type="text" formControlName="firstname" placeholder="First name" />
                    <div class="error" *ngIf="
              form.controls['firstname'].invalid &&
              form.controls['firstname'].touched
            ">
                        First name is required.
                    </div>
                </div>

                <!-- Last name -->
                <div class="form-group">
                    <label for="lastname">Last name</label>
                    <input id="lastname" type="text" formControlName="lastname" placeholder="Last name" />
                    <div class="error" *ngIf="
              form.controls['lastname'].invalid &&
              form.controls['lastname'].touched
            ">
                        Last name is required.
                    </div>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
                <div class="error" *ngIf="
            form.controls['email'].invalid &&
            form.controls['email'].touched
          ">
                    Please enter a valid email address.
                </div>
            </div>

            <!-- Passwords -->
            <div class="form-row two-cols">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" formControlName="password" placeholder="Password" />
                    <div class="error" *ngIf="
              form.controls['password'].invalid &&
              form.controls['password'].touched
            ">
                        Password is required.
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" type="password" formControlName="confirmPassword"
                        placeholder="Confirm password" />
                    <div class="error" *ngIf="
              form.hasError('mismatch') &&
              form.controls['confirmPassword'].touched
            ">
                        Passwords do not match.
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button type="submit" class="btn primary" [disabled]="form.invalid">
                    Register
                </button>
            </div>
        </form>

        <footer class="register-footer">
            <p>
                Already have an account?
                <a routerLink="/login">Sign in</a>
            </p>
        </footer>
    </div>
</div>
